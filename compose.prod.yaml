services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/eduafq/proyectotendencias:latest}
    pull_policy: always
    environment:
      PARKING_DATABASE_URL: sqlite:////data/parking.db
    ports:
      - "${PORT:-5000}:8000"
    volumes:
      - parking_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  parking_data:
