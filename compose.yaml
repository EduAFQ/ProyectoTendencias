services:
  app:
    build:
      context: .
    command:
      - sh
      - -c
      - python -m flaskr.inicializarBD && exec python -m flask --app flaskr:create_app run --host=0.0.0.0 --port=8000 --debug
    environment:
      FLASK_DEBUG: "1"
      PARKING_DATABASE_URL: sqlite:////data/parking.db
    ports:
      - "${PORT:-5000}:8000"
    volumes:
      - parking_data:/data
      - .:/app
    restart: unless-stopped

volumes:
  parking_data:
